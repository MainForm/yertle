name: yertle-nucleo-f103rb

x-firmware-environment: &firmware-environment
  build:
    context: .
    dockerfile: Dockerfile
  image: yertle-nucleo-f103rb-dev:bookworm-arm-none-eabi
  working_dir: /workspace
  volumes:
    - ./:/workspace
  init: true

services:
  setup:
    <<: *firmware-environment
    command: ["bash", "scripts/setup-libraries.sh"]

  freertos-dev:
    <<: *firmware-environment
    depends_on:
      setup:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: sleep infinity

  f103-build:
    <<: *firmware-environment
    depends_on:
      setup:
        condition: service_completed_successfully
    command: ["bash", "scripts/build-f103.sh"]
